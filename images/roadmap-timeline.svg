<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="Four-year roadmap timeline from Year 1 to Career (placeholder milestones)">
  <!-- Edit the "Milestone" text under each year. Each card fits about 18 characters per line. -->
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #003057; }
    .muted { fill: #556274; }
    .line { stroke: #003057; }
    .card { fill: #f6f7f9; stroke: #e1e5eb; }
    .year { fill: #003057; }
    .text { fill: #1a2433; }
    .node { fill: #b3a369; stroke: #003057; }
    .goal { fill: #003057; }
    .arrow { fill: #003057; }
    .goal-text { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121c2c; }
      .title { fill: #f2f5f9; }
      .muted { fill: #9aa8bb; }
      .line { stroke: #4a5d7a; }
      .card { fill: #182437; stroke: #2a3a52; }
      .year { fill: #d6c58a; }
      .text { fill: #e6ebf2; }
      .node { fill: #c9b97d; stroke: #121c2c; }
      .goal { fill: #c9b97d; }
      .arrow { fill: #4a5d7a; }
      .goal-text { fill: #0b1320; }
    }
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  </style>
  <rect class="bg" width="1000" height="340"/>
  <text class="title" x="40" y="44" font-size="20" font-weight="700">My Roadmap</text>
  <text class="muted" x="40" y="68" font-size="13">(edit milestones)</text>

  <!-- spine -->
  <line class="line" x1="60" y1="190" x2="900" y2="190" stroke-width="4" stroke-linecap="round"/>
  <path class="arrow" d="M904 190l-16-10v20z"/>

  <!-- Year cards: above / below the line, alternating -->
  <g text-anchor="middle">
    <!-- Year 1 -->
    <rect class="card" x="40" y="92" width="160" height="66" rx="10" stroke-width="1.5"/>
    <text class="year" x="120" y="118" font-size="15" font-weight="700">Year 1</text>
    <text class="text" x="120" y="142" font-size="14">Milestone</text>
    <line class="line" x1="120" y1="158" x2="120" y2="178" stroke-width="2"/>

    <!-- Year 2 -->
    <rect class="card" x="240" y="222" width="160" height="66" rx="10" stroke-width="1.5"/>
    <text class="year" x="320" y="248" font-size="15" font-weight="700">Year 2</text>
    <text class="text" x="320" y="272" font-size="14">Milestone</text>
    <line class="line" x1="320" y1="202" x2="320" y2="222" stroke-width="2"/>

    <!-- Year 3 -->
    <rect class="card" x="440" y="92" width="160" height="66" rx="10" stroke-width="1.5"/>
    <text class="year" x="520" y="118" font-size="15" font-weight="700">Year 3</text>
    <text class="text" x="520" y="142" font-size="14">Milestone</text>
    <line class="line" x1="520" y1="158" x2="520" y2="178" stroke-width="2"/>

    <!-- Year 4 -->
    <rect class="card" x="640" y="222" width="160" height="66" rx="10" stroke-width="1.5"/>
    <text class="year" x="720" y="248" font-size="15" font-weight="700">Year 4</text>
    <text class="text" x="720" y="272" font-size="14">Milestone</text>
    <line class="line" x1="720" y1="202" x2="720" y2="222" stroke-width="2"/>
  </g>

  <!-- nodes -->
  <g class="node" stroke-width="3">
    <circle cx="120" cy="190" r="11"/>
    <circle cx="320" cy="190" r="11"/>
    <circle cx="520" cy="190" r="11"/>
    <circle cx="720" cy="190" r="11"/>
  </g>

  <!-- Career goal -->
  <rect class="goal" x="830" y="92" width="140" height="56" rx="28"/>
  <text class="goal-text" x="900" y="126" font-size="16" font-weight="700" text-anchor="middle">Career</text>
  <line class="line" x1="900" y1="148" x2="900" y2="176" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
