<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Computer Engineering banner with circuit traces">
  <!-- Placeholder banner. Replace with a photo of you working on a project if you like. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a33"/>
      <stop offset="1" stop-color="#003057"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#b3a369" stop-opacity=".22"/>
      <stop offset="1" stop-color="#b3a369" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#b3a369" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 110h170l40 40h140" stroke-opacity=".8"/>
    <path d="M0 250h120l50-50h120l30 30h90" stroke-opacity=".6"/>
    <path d="M0 310h260l30-30h60" stroke-opacity=".4"/>
    <path d="M1200 90h-180l-40 40h-130" stroke-opacity=".8"/>
    <path d="M1200 230h-140l-40 40h-160" stroke-opacity=".6"/>
    <path d="M1200 320h-260l-30-30h-70" stroke-opacity=".4"/>
  </g>
  <g fill="#b3a369">
    <circle cx="350" cy="150" r="7"/>
    <circle cx="440" cy="230" r="7"/>
    <circle cx="350" cy="280" r="5"/>
    <circle cx="850" cy="130" r="7"/>
    <circle cx="740" cy="270" r="7"/>
    <circle cx="840" cy="290" r="5"/>
  </g>

  <!-- chip -->
  <g transform="translate(540 128)">
    <g stroke="#b3a369" stroke-width="3" stroke-linecap="round">
      <path d="M20 0v-14M45 0v-14M70 0v-14M95 0v-14"/>
      <path d="M20 104v14M45 104v14M70 104v14M95 104v14"/>
      <path d="M0 22h-14M0 52h-14M0 82h-14"/>
      <path d="M120 22h14M120 52h14M120 82h14"/>
    </g>
    <rect width="120" height="104" rx="10" fill="#0b2647" stroke="#b3a369" stroke-width="3"/>
    <rect x="24" y="22" width="72" height="60" rx="6" fill="none" stroke="#b3a369" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <text x="600" y="78" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#ffffff">Computer Engineering</text>
  <text x="600" y="316" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="6" text-anchor="middle" fill="#b3a369">GEORGIA TECH · ECE</text>
</svg>
