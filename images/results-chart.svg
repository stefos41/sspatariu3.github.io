<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d">
  <title id="t">GlowBox test strip results</title>
  <desc id="d">Absorbance of four test strips on a log scale, with the positive cut-off at 0.0126. Blank paper 0.006 (NEG); red marker line 0.110 (POS); faint marker line 0.232 (POS); dark blue/black marker line 0.693 (POS). Source: GlowBox report, device log files, 6 to 7 November 2026.</desc>
  <!-- Data from "GlowBox: An Embedded Reader for Colorimetric Test Strips", Results > Test strips.
       x position = 230 + 223.333 * log10(value / 0.001)  (0.001 at x=230, 1 at x=900). -->
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #003057; }
    .ink { fill: #1a2433; }
    .muted { fill: #556274; }
    .grid { stroke: #e1e5eb; }
    .axis { stroke: #c3ccd9; }
    .bar { fill: #2f6db3; }
    .cut { stroke: #7a6a2c; }
    .cut-text { fill: #7a6a2c; }
    .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121c2c; }
      .title { fill: #f2f5f9; }
      .ink { fill: #dfe6ef; }
      .muted { fill: #9aa8bb; }
      .grid { stroke: #243349; }
      .axis { stroke: #3a4c66; }
      .bar { fill: #5a8fd6; }
      .cut { stroke: #d6c58a; }
      .cut-text { fill: #d6c58a; }
      .halo { stroke: #121c2c; }
    }
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  </style>
  <rect class="bg" width="1000" height="380"/>
  <text class="title" x="40" y="44" font-size="20" font-weight="700">Test strip results</text>
  <text class="muted" x="40" y="68" font-size="13">Absorbance, log scale (each gridline is 10× more)</text>

  <!-- gridlines + baseline -->
  <g class="grid" stroke-width="1">
    <path d="M453.3 96V302M676.7 96V302M900 96V302"/>
  </g>
  <path class="axis" d="M230 96V302" stroke-width="2"/>

  <!-- bars: square at the baseline, 4px rounded data end -->
  <g class="bar">
    <path d="M230 110H399.8a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H230z"/>
    <path d="M230 160H681.9a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H230z"/>
    <path d="M230 210H754.3a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H230z"/>
    <path d="M230 260H860.4a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H230z"/>
  </g>

  <!-- cut-off line -->
  <path class="cut" d="M475.8 90V306" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="cut-text" x="481" y="94" font-size="13" font-weight="700">cut-off 0.0126</text>

  <!-- category labels -->
  <g class="ink" font-size="14" font-weight="600" text-anchor="end">
    <text x="218" y="129">Blank paper</text>
    <text x="218" y="179">Red marker line</text>
    <text x="218" y="229">Faint marker line</text>
    <text x="218" y="279">Dark blue/black line</text>
  </g>

  <!-- value labels (text ink, not series color) -->
  <g class="ink halo" font-size="14">
    <text x="413" y="129">0.006 NEG</text>
    <text x="696" y="179">0.110 POS</text>
    <text x="768" y="229">0.232 POS</text>
    <text x="874" y="279">0.693 POS</text>
  </g>

  <!-- x axis ticks -->
  <g class="muted" font-size="13" text-anchor="middle">
    <text x="230" y="326">0.001</text>
    <text x="453.3" y="326">0.01</text>
    <text x="676.7" y="326">0.1</text>
    <text x="900" y="326">1</text>
  </g>
  <text class="muted" x="565" y="354" font-size="13" text-anchor="middle">absorbance</text>
</svg>
