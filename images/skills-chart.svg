<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Bar chart of five strengths (placeholder)">
  <!-- Edit the five labels and bar widths below (max bar width is 520 = 100%). -->
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #003057; }
    .label { fill: #1a2433; }
    .muted { fill: #556274; }
    .track { fill: #eef1f5; }
    .grid { stroke: #e1e5eb; }
    .bar { fill: #b3a369; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #121c2c; }
      .title { fill: #f2f5f9; }
      .label { fill: #e6ebf2; }
      .muted { fill: #9aa8bb; }
      .track { fill: #1c2a40; }
      .grid { stroke: #243349; }
      .bar { fill: #c9b97d; }
    }
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  </style>
  <rect class="bg" width="760" height="360"/>
  <text class="title" x="40" y="44" font-size="20" font-weight="700">My Strengths</text>
  <text class="muted" x="40" y="68" font-size="13">(edit labels and bar lengths)</text>

  <!-- gridlines at 0/25/50/75/100% -->
  <g class="grid" stroke-width="1" stroke-dasharray="3 4">
    <path d="M190 92v228M320 92v228M450 92v228M580 92v228M710 92v228"/>
  </g>

  <g font-size="15" font-weight="600">
    <text class="label" x="40" y="119">Strength 1</text>
    <text class="label" x="40" y="164">Strength 2</text>
    <text class="label" x="40" y="209">Strength 3</text>
    <text class="label" x="40" y="254">Strength 4</text>
    <text class="label" x="40" y="299">Strength 5</text>
  </g>

  <g>
    <rect class="track" x="190" y="100" width="520" height="26" rx="13"/>
    <rect class="track" x="190" y="145" width="520" height="26" rx="13"/>
    <rect class="track" x="190" y="190" width="520" height="26" rx="13"/>
    <rect class="track" x="190" y="235" width="520" height="26" rx="13"/>
    <rect class="track" x="190" y="280" width="520" height="26" rx="13"/>
  </g>
  <g>
    <rect class="bar" x="190" y="100" width="480" height="26" rx="13"/>
    <rect class="bar" x="190" y="145" width="410" height="26" rx="13"/>
    <rect class="bar" x="190" y="190" width="350" height="26" rx="13"/>
    <rect class="bar" x="190" y="235" width="290" height="26" rx="13"/>
    <rect class="bar" x="190" y="280" width="220" height="26" rx="13"/>
  </g>
</svg>
